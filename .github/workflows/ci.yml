name: CI

# Runs the full validation suite and the frontend build on every push and
# pull request, with NO secrets configured: the live PayPal integration
# test skips cleanly when PAYPAL_CLIENT_ID/PAYPAL_CLIENT_SECRET are absent
# (unittest skipUnless in backend/validation/test_paypal_escrow.py), and
# demo mode needs no credentials.
on:
  push:
  pull_request:

jobs:
  backend-validation:
    name: Backend validation suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Validation Suite
        run: python backend/validation/run_all_tests.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # Cold-clone job (Phase 3, backend/validation/THRESHOLDS.md SS6):
  # runs ONLY the commands the README gives a stranger, in order, and
  # nothing else — no extra installs, no extra flags. Under these
  # commands the validation-only dependencies (hypothesis, shap) are
  # absent by design: the property suite reports an explicit SKIP and
  # the oracle suite uses its brute-force fallback (THRESHOLDS.md SS6).
  cold-clone:
    name: Cold-clone, README commands only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install backend dependencies (README)
        run: .venv/bin/pip install -r backend/requirements.txt

      - name: Copy env template (README)
        run: cp .env.example .env

      - name: Run validation suite
        run: .venv/bin/python backend/validation/run_all_tests.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
